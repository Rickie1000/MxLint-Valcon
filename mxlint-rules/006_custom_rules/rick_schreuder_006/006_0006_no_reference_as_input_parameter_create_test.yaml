TestCases:

###############################################################################
# PASS CASE — Create Object uses normal value (no reference path)
###############################################################################

- name: allow_create_object_simple_value
  allow: true
  input:
    ObjectCollection:
      Objects:
        - $Type: Microflows$ActionActivity
          Action:
            $Type: Microflows$CreateChangeAction
            Entity: MyModule.Order
            VariableName: NewOrder
            Items:
              - $Type: Microflows$ChangeActionItem
                Attribute: MyModule.Order.Status
                Value: MyModule.ENUM_Order_Status.Draft


###############################################################################
# FAIL CASE — Create Object uses reference path in Value
###############################################################################

- name: disallow_create_object_reference_path_in_value
  allow: false
  input:
    ObjectCollection:
      Objects:
        - $Type: Microflows$ActionActivity
          Action:
            $Type: Microflows$CreateChangeAction
            Entity: MyModule.Order
            VariableName: NewOrder
            Items:
              - $Type: Microflows$ChangeActionItem
                Attribute: MyModule.Order.Customer
                Value: $Product/MyModule.Product_Order/MyModule.Order_OrderCustomer/MyModule.Customer
